name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk PocketPen.apk

      - name: Keep APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketPen-apk
          path: PocketPen.apk

      # Publishes the APK on the repo's "Releases" page so you can grab it
      # straight from your phone's browser.
      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Pocket Pen (latest build)
          body: Built from ${{ github.sha }}. Download PocketPen.apk below and open it on your phone to install.
          files: PocketPen.apk
          make_latest: true
